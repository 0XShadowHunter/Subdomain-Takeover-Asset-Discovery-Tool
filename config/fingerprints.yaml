# Service fingerprints for takeover detection.
# Reference: https://github.com/EdOverflow/can-i-take-over-xyz
#
# Fully editable — adding/updating services needs NO code changes (§5 AC).
#
# Fields per service:
#   service:         human-readable name
#   cname_patterns:  fnmatch patterns the CNAME target must match (required for
#                    detector 1/2; empty patterns = detector 4 (A-record) only)
#   fingerprints:    case-insensitive substrings matched against the HTTP
#                    title + body snippet
#   nxdomain:        true when a NXDOMAIN target is itself claimable
#                    (e.g. the target domain can be registered)
#   status:          vulnerable | edge-case | not-vulnerable
#                    - vulnerable:     flag with HIGH confidence on match
#                    - edge-case:      flag with MEDIUM confidence (manual check)
#                    - not-vulnerable: NEVER flagged (kept here to document why)
#   severity:        HIGH | MEDIUM | LOW | INFO (CRITICAL reserved for manual review)
#   references:      links shown in the report
#   remediation:     advice text (advice only — this tool never modifies anything)
#
# detection:
#   recheck_dns:     re-verify dangling candidates with a second DNS query (§5 FP rule)
#   enable_dangling_a: detector 4 (best-effort, A-record pages) — disabled by default

detection:
  recheck_dns: true
  enable_dangling_a: false

services:

  # ============================ VULNERABLE ============================

  - service: "GitHub Pages"
    cname_patterns: ["*.github.io"]
    fingerprints: ["There isn't a GitHub Pages site here."]
    nxdomain: false
    status: "vulnerable"
    severity: "HIGH"
    references:
      - "https://github.com/EdOverflow/can-i-take-over-xyz"
      - "https://docs.github.com/en/pages/getting-started-with-github-pages/about-github-pages"
    remediation: "Create the missing GitHub Pages repository/site under the same name, or remove the CNAME record."

  - service: "AWS S3"
    cname_patterns: ["*.s3.amazonaws.com", "*.s3-website-*.amazonaws.com", "*.s3-website.*.amazonaws.com", "*.s3.dualstack.*.amazonaws.com"]
    fingerprints: ["NoSuchBucket", "The specified bucket does not exist"]
    nxdomain: false
    status: "vulnerable"
    severity: "HIGH"
    references:
      - "https://github.com/EdOverflow/can-i-take-over-xyz"
      - "https://docs.aws.amazon.com/AmazonS3/latest/userguide/WebsiteHosting.html"
    remediation: "Re-create the S3 bucket with the same name (same region) or remove the DNS record pointing to it."

  - service: "Heroku"
    cname_patterns: ["*.herokuapp.com"]
    fingerprints: ["No such app"]
    nxdomain: false
    status: "vulnerable"
    severity: "HIGH"
    references:
      - "https://github.com/EdOverflow/can-i-take-over-xyz"
      - "https://devcenter.heroku.com/articles/custom-domains"
    remediation: "Re-create the Heroku app with the same name or remove the DNS record."

  - service: "Azure Web Apps"
