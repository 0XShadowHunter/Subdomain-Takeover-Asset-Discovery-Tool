  # ============================ EDGE CASES ============================
  # Fingerprint match reports MEDIUM confidence — needs manual verification.

  - service: "Pingdom (public status page)"
    cname_patterns: ["*.pingdom.com", "stats.pingdom.com"]
    fingerprints: ["sorry, couldn't find the status page"]
    nxdomain: false
    status: "edge-case"
    severity: "LOW"
    references:
      - "https://github.com/EdOverflow/can-i-take-over-xyz"
    remediation: "Verify the Pingdom status page manually; remove the DNS record if unused."

  # ========================== NOT VULNERABLE ==========================
  # Never flagged — kept here to document why (claiming is not possible).

  - service: "CloudFront"
    cname_patterns: ["*.cloudfront.net"]
    fingerprints: ["ERROR: The request could not be satisfied", "Bad request"]
    nxdomain: false
    status: "not-vulnerable"
    severity: "INFO"
    references:
      - "https://github.com/EdOverflow/can-i-take-over-xyz"
    remediation: "N/A — AWS blocks claiming a distribution id; safe to ignore but consider cleanup."

