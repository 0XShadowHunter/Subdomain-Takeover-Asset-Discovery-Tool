    nxdomain: false
    status: "vulnerable"
    severity: "HIGH"
    references:
      - "https://github.com/EdOverflow/can-i-take-over-xyz"
      - "https://learn.microsoft.com/en-us/azure/app-service/app-service-web-tutorial-custom-domain"
    remediation: "Re-create the Azure App Service and re-bind the custom domain, or remove the DNS record."

  - service: "Netlify"
    cname_patterns: ["*.netlify.app", "*.netlifyglobalcdn.com"]
    fingerprints: ["Not found"]
    nxdomain: false
    status: "vulnerable"
    severity: "HIGH"
    references:
